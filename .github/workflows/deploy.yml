# 部署前端到 GitHub Pages
# 触发：push 到 main 分支，或手动触发（Actions 页面 Run workflow）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支并发部署时取消旧的，避免排队堆积
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 必须显式指定 Node 20.x：默认版本可能导致 npm install 内存不足失败
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 npm 使用官方 registry（lock 中 npmmirror 在美国服务器拉取不稳定）
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（独立步骤，错误直接显示在日志/Annotations）
        run: npx vue-tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 构建生产包（vite.config.ts 中 base=/star-ticket/ 仅在 production 生效）
        # --logLevel warn 抑制 transforming 刷屏输出，防止 GitHub 截断日志
        run: npx vite build --logLevel warn

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
