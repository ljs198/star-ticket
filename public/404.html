<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>星幕票务交易平台</title>
  <!--
    SPA 刷新 404 恢复（spa-github-pages 方案）
    GitHub Pages 找不到 /star-ticket/xxx 物理文件时返回本页，
    这里把子路径编码为 /?/xxx 形式重定向回首页，由 index.html 的脚本还原。
    pathSegmentsToKeep = 1：保留 /star-ticket 仓库前缀
  -->
  <script>
    var pathSegmentsToKeep = 1
    var l = window.location
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
</head>
<body></body>
</html>
